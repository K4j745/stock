<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StockWatch — Portfolios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root, [data-theme="dark"] {
    --color-bg: #0d1117; --color-surface: #161b22; --color-surface-2: #1c2128; --color-surface-offset: #21262d;
    --color-border: #30363d; --color-divider: #21262d; --color-text: #e6edf3; --color-text-muted: #8b949e; --color-text-faint: #484f58;
    --color-primary: #388bfd; --color-success: #3fb950; --color-success-muted: #1a3a24; --color-error: #f85149; --color-error-muted: #3d1a1a;
    --color-warning: #e3b341; --color-warning-muted: #3a2f12;
    --font-body: 'Inter', system-ui, sans-serif; --font-mono: 'JetBrains Mono', monospace;
    --radius-md: 0.5rem; --radius-lg: 0.75rem;
  }
  [data-theme="light"] {
    --color-bg: #f6f8fa; --color-surface: #ffffff; --color-surface-2: #f6f8fa; --color-surface-offset: #f0f3f6;
    --color-border: #d0d7de; --color-divider: #eaeef2; --color-text: #1f2328; --color-text-muted: #656d76; --color-text-faint: #adb5bd;
    --color-primary: #0969da; --color-success: #1a7f37; --color-success-muted: #d4f8df; --color-error: #cf222e; --color-error-muted: #fde8e8;
    --color-warning: #9a6700; --color-warning-muted: #fff8c5;
  }
  body { background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); font-size: 14px; min-height: 100vh; }
  .site-header { position: sticky; top:0; z-index: 100; height: 56px; background: var(--color-surface); border-bottom: 1px solid var(--color-border); display: flex; align-items: center; padding: 0 24px; }
  .site-header .logo { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--color-text); font-weight: 600; font-size: 16px; }
  .site-header .logo svg { color: var(--color-primary); }
  .site-header nav { display: flex; gap: 4px; margin: 0 auto; }
  .site-header nav a { color: var(--color-text-muted); text-decoration: none; padding: 6px 16px; border-radius: var(--radius-md); font-weight: 500; }
  .site-header nav a.active { color: var(--color-text); background: var(--color-surface-2); }
  .site-header nav a:hover { color: var(--color-text); background: var(--color-surface-offset); }

  .container { max-width: 1480px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 22px; font-weight: 600; margin-bottom: 4px; }
  .subtitle { color: var(--color-text-muted); font-size: 13px; margin-bottom: 16px; }

  .portfolio-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .pf-btn { padding: 6px 14px; background: var(--color-surface); border: 1px solid var(--color-border); color: var(--color-text-muted); border-radius: var(--radius-md); cursor: pointer; font-family: var(--font-body); font-size: 13px; }
  .pf-btn.active { background: var(--color-primary); color: white; border-color: var(--color-primary); }
  .pf-btn.compare { background: var(--color-surface-2); }

  .mode-row { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; font-size: 13px; color: var(--color-text-muted); }
  .mode-row select { background: var(--color-surface-2); border: 1px solid var(--color-border); color: var(--color-text); border-radius: var(--radius-md); padding: 4px 8px; font-size: 12.5px; }

  .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .kpi { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: 14px 16px; }
  .kpi .label { font-size: 11px; color: var(--color-text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
  .kpi .value { font-family: var(--font-mono); font-size: 22px; font-weight: 500; }
  .kpi .sub { font-size: 11px; color: var(--color-text-muted); margin-top: 4px; }
  .pos { color: var(--color-success); } .neg { color: var(--color-error); } .warn { color: var(--color-warning); }

  .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; align-items: start; }
  @media (max-width: 1024px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); overflow: hidden; }
  .card-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--color-divider); }
  .card-header h2 { font-size: 14px; font-weight: 600; }
  .badge { font-family: var(--font-mono); font-size: 12px; color: var(--color-text-muted); }
  .card-body { padding: 16px; }

  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  thead th { position: sticky; top: 0; background: var(--color-surface); text-align: left; padding: 8px 12px; font-size: 11px; color: var(--color-text-muted); text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid var(--color-divider); }
  td { padding: 8px 12px; border-bottom: 1px solid var(--color-divider); white-space: nowrap; }
  td.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  td.ticker { font-family: var(--font-mono); font-weight: 600; color: var(--color-primary); }
  tbody tr:hover { background: var(--color-surface-offset); }
  .signal-badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .signal-BUY { background: var(--color-success-muted); color: var(--color-success); border: 1px solid var(--color-success); }
  .signal-SELL { background: var(--color-error-muted); color: var(--color-error); border: 1px solid var(--color-error); }
  .signal-HOLD { background: var(--color-warning-muted); color: var(--color-warning); border: 1px solid var(--color-warning); }
  .table-wrapper { max-height: 460px; overflow: auto; }
  .download-row { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
  .download-row a { font-size: 12px; padding: 6px 12px; background: var(--color-surface-2); border: 1px solid var(--color-border); color: var(--color-text); border-radius: var(--radius-md); text-decoration: none; font-family: var(--font-mono); }
  .download-row a:hover { border-color: var(--color-primary); color: var(--color-primary); }
  .compare-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
  .compare-card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: 16px; }
  .compare-card h3 { font-size: 14px; margin-bottom: 8px; }
  .compare-card .metric { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid var(--color-divider); font-size: 12px; }
  .compare-card .metric:last-child { border-bottom: 0; }
  .compare-card .metric .v { font-family: var(--font-mono); }
  .chart-wrap { position: relative; height: 360px; padding: 12px; }
  .empty { text-align: center; padding: 60px 20px; color: var(--color-text-muted); }
  .small { font-size: 11px; color: var(--color-text-muted); }
  .meta-pre { font-family: var(--font-mono); font-size: 11px; color: var(--color-text-muted); white-space: pre-wrap; word-break: break-all; padding: 12px; max-height: 240px; overflow: auto; }
  .pill { display: inline-block; padding: 1px 8px; font-size: 10px; border-radius: 999px; background: var(--color-surface-offset); color: var(--color-text-muted); font-family: var(--font-mono); }

  .theme-toggle { background: none; border: 1px solid var(--color-border); color: var(--color-text-muted); width: 36px; height: 36px; border-radius: var(--radius-md); cursor: pointer; }
</style>
</head>
<body>

<header class="site-header">
  <a href="../" class="logo">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
    StockWatch
  </a>
  <nav>
    <a href="../">Overview</a>
    <a href="../prices/">Prices</a>
    <a href="../charts/">Charts</a>
    <a href="../signals/">Signals</a>
    <a href="../portfolio/" class="active">Portfolios</a>
  </nav>
  <div style="display:flex;align-items:center;gap:12px">
    <button class="theme-toggle" id="themeToggle">☼</button>
  </div>
</header>

<div class="container">
  <h1>Portfolio analyzer</h1>
  <div class="subtitle">Compare strategies side by side. Every transaction, position, and equity-curve point is derived from the same generated dataset.</div>

  <div id="portfolioBar" class="portfolio-bar"></div>

  <div class="mode-row">
    <label>View:
      <select id="viewMode">
        <option value="single">Single portfolio (detail)</option>
        <option value="compare">Side-by-side compare</option>
      </select>
    </label>
    <span class="small" id="meta"></span>
  </div>

  <div id="singleView"></div>
  <div id="compareView" style="display:none"></div>
</div>

<script>
(function(){
  var saved = localStorage.getItem('stockwatch-theme');
  var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', theme);
  document.getElementById('themeToggle').addEventListener('click', function(){
    var t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', t);
    localStorage.setItem('stockwatch-theme', t);
  });

  var portfolios = [];
  var selected = []; // portfolio_ids
  var cache = {};
  var chartObj = null;

  function fmt(v, d, units){
    if (v === null || v === undefined || v !== v) return '—';
    var p = Number(v);
    if (units === 'pct') return (p*100).toFixed(d != null ? d : 2) + '%';
    if (units === 'money') return '$' + p.toLocaleString(undefined, { maximumFractionDigits: 2 });
    return p.toFixed(d != null ? d : 4);
  }
  function cls(v){ if (v === null || v === undefined) return ''; return v >= 0 ? 'pos' : 'neg'; }

  function loadPortfolio(pid){
    if (cache[pid]) return Promise.resolve(cache[pid]);
    return Promise.all([
      fetch('../data/portfolios/' + pid + '/summary.json').then(r=>r.json()),
      fetch('../data/portfolios/' + pid + '/equity_curve.json').then(r=>r.json()),
      fetch('../data/portfolios/' + pid + '/transactions.json').then(r=>r.json()),
      fetch('../data/portfolios/' + pid + '/positions.json').then(r=>r.json()),
      fetch('../data/portfolios/' + pid + '/metrics.json').then(r=>r.json()).catch(()=>({}))
    ]).then(function(r){
      cache[pid] = { summary: r[0], curve: r[1], transactions: r[2], positions: r[3], metrics: r[4] };
      return cache[pid];
    });
  }

  function renderPortfolioBar(){
    var bar = document.getElementById('portfolioBar');
    bar.innerHTML = '';
    portfolios.forEach(function(p){
      var b = document.createElement('button');
      b.className = 'pf-btn' + (selected.indexOf(p.portfolio_id) > -1 ? ' active' : '');
      b.textContent = p.portfolio_name;
      b.title = p.description + ' | source=' + (p.signal_source || '?');
      b.addEventListener('click', function(){
        var mode = document.getElementById('viewMode').value;
        if (mode === 'single') {
          selected = [p.portfolio_id];
        } else {
          var idx = selected.indexOf(p.portfolio_id);
          if (idx > -1) selected.splice(idx, 1);
          else selected.push(p.portfolio_id);
          if (!selected.length) selected = [p.portfolio_id];
        }
        renderPortfolioBar();
        render();
      });
      bar.appendChild(b);
    });
  }

  function renderSingle(pid){
    return loadPortfolio(pid).then(function(d){
      var s = d.summary, m = s.metrics || {}, bm = s.benchmark_metrics || {};
      var html = '';
      html += '<div class="kpi-row">';
      html += kpi('Total Return', fmt(m.total_return, 2, 'pct'), 'vs benchmark ' + fmt(bm.total_return, 2, 'pct'), cls(m.total_return));
      html += kpi('CAGR', fmt(m.cagr, 2, 'pct'), '');
      html += kpi('Sharpe', fmt(m.sharpe_ratio, 2), '');
      html += kpi('Max DD', fmt(m.max_drawdown, 2, 'pct'), '', 'neg');
      html += kpi('Final value', fmt(s.final_value, 0, 'money'), 'Initial: ' + fmt(s.initial_capital, 0, 'money'));
      html += kpi('# Trades', m.trade_n_trades || 0, 'Win rate ' + fmt(m.trade_win_rate, 1, 'pct'));
      html += kpi('Profit factor', fmt(m.trade_profit_factor, 2), 'Exp.: ' + fmt(m.trade_expectancy, 2));
      html += '</div>';

      html += '<div class="grid">';
      html += '<div>';
      html += '<div class="card"><div class="card-header"><h2>Equity curve vs benchmark</h2><span class="badge">' + (s.metadata && s.metadata.first_date || '') + ' → ' + (s.metadata && s.metadata.last_date || '') + '</span></div><div class="chart-wrap"><canvas id="curveChart"></canvas></div></div>';
      html += '<div class="card" style="margin-top:16px"><div class="card-header"><h2>Transactions (' + (d.transactions || []).length + ')</h2><span class="badge">execution_date • action • price</span></div><div class="table-wrapper">' + renderTransactionsTable(d.transactions) + '</div></div>';
      html += '</div>';
      html += '<div>';
      html += '<div class="card"><div class="card-header"><h2>Current positions</h2><span class="badge">' + (d.positions || []).length + ' open</span></div><div class="table-wrapper">' + renderPositionsTable(d.positions) + '</div></div>';
      html += '<div class="card" style="margin-top:16px"><div class="card-header"><h2>Strategy metadata</h2><span class="badge">audit</span></div><div class="meta-pre">' + escapeHtml(JSON.stringify(s.metadata || {}, null, 2)) + '</div></div>';
      html += '<div class="card" style="margin-top:16px"><div class="card-header"><h2>Trade metrics</h2></div><div class="card-body">' + renderTradeMetricsBox(m) + '</div></div>';
      html += '</div>';
      html += '</div>';

      html += '<div class="download-row">';
      html += '<a href="../data/portfolios/' + pid + '/transactions.json">transactions.json</a>';
      html += '<a href="../data/portfolios/' + pid + '/decisions.json">decisions.json</a>';
      html += '<a href="../data/portfolios/' + pid + '/equity_curve.json">equity_curve.json</a>';
      html += '<a href="../data/portfolios/' + pid + '/positions.json">positions.json</a>';
      html += '<a href="../data/portfolios/' + pid + '/metrics.json">metrics.json</a>';
      html += '<a href="../data/portfolios/' + pid + '/trades.csv">trades.csv</a>';
      html += '</div>';

      document.getElementById('singleView').innerHTML = html;
      renderCurveChart(d);
    });
  }

  function kpi(label, value, sub, klass){
    return '<div class="kpi"><div class="label">' + label + '</div><div class="value ' + (klass||'') + '">' + value + '</div><div class="sub">' + (sub||'') + '</div></div>';
  }

  function renderTransactionsTable(rows){
    rows = rows || [];
    rows = rows.slice().reverse();
    if (!rows.length) return '<div class="empty">No transactions in this portfolio.</div>';
    var html = '<table><thead><tr><th>Date</th><th>Ticker</th><th>Action</th><th>Qty</th><th>Price</th><th>Cash after</th><th>PV after</th><th>P&L $</th><th>P&L %</th><th>Cum P&L</th><th>Hold (d)</th><th>Signal</th><th>Reason</th></tr></thead><tbody>';
    rows.forEach(function(r){
      html += '<tr>';
      html += '<td class="mono small">' + r.execution_date + '</td>';
      html += '<td class="ticker">' + r.ticker + '</td>';
      html += '<td><span class="signal-badge signal-' + r.action + '">' + r.action + '</span></td>';
      html += '<td class="mono">' + (r.quantity != null ? r.quantity : '') + '</td>';
      html += '<td class="mono">' + fmt(r.execution_price, 2) + '</td>';
      html += '<td class="mono">' + fmt(r.cash_after, 0, 'money') + '</td>';
      html += '<td class="mono">' + fmt(r.portfolio_value_after, 0, 'money') + '</td>';
      html += '<td class="mono ' + cls(r.trade_pnl_abs) + '">' + (r.trade_pnl_abs != null ? fmt(r.trade_pnl_abs, 0, 'money') : '—') + '</td>';
      html += '<td class="mono ' + cls(r.trade_pnl_pct) + '">' + (r.trade_pnl_pct != null ? fmt(r.trade_pnl_pct, 2, 'pct') : '—') + '</td>';
      html += '<td class="mono ' + cls(r.cumulative_pnl) + '">' + fmt(r.cumulative_pnl, 0, 'money') + '</td>';
      html += '<td class="mono">' + (r.holding_period_days != null ? r.holding_period_days : '—') + '</td>';
      html += '<td><span class="pill">' + (r.signal_id || '').slice(0, 18) + '…</span></td>';
      html += '<td class="small">' + (r.triggered_rules || r.reason || '') + '</td>';
      html += '</tr>';
    });
    html += '</tbody></table>';
    return html;
  }

  function renderPositionsTable(rows){
    rows = rows || [];
    if (!rows.length) return '<div class="empty">No open positions.</div>';
    var html = '<table><thead><tr><th>Ticker</th><th>Shares</th><th>Avg cost</th><th>Last</th><th>Value</th><th>P&L</th></tr></thead><tbody>';
    rows.forEach(function(r){
      html += '<tr>';
      html += '<td class="ticker">' + r.ticker + '</td>';
      html += '<td class="mono">' + r.shares + '</td>';
      html += '<td class="mono">' + fmt(r.avg_cost, 2) + '</td>';
      html += '<td class="mono">' + fmt(r.last_price, 2) + '</td>';
      html += '<td class="mono">' + fmt(r.market_value, 0, 'money') + '</td>';
      html += '<td class="mono ' + cls(r.unrealised_pnl_pct) + '">' + (r.unrealised_pnl_pct != null ? fmt(r.unrealised_pnl_pct, 2, 'pct') : '—') + '</td>';
      html += '</tr>';
    });
    html += '</tbody></table>';
    return html;
  }

  function renderTradeMetricsBox(m){
    var html = '';
    var rows = [
      ['Trades', m.trade_n_trades],
      ['Wins', m.trade_n_wins],
      ['Losses', m.trade_n_losses],
      ['Win rate', fmt(m.trade_win_rate, 1, 'pct')],
      ['Avg trade P&L', fmt(m.trade_avg_trade_pnl, 2)],
      ['Avg win', fmt(m.trade_avg_win, 2)],
      ['Avg loss', fmt(m.trade_avg_loss, 2)],
      ['Profit factor', fmt(m.trade_profit_factor, 2)],
      ['Expectancy', fmt(m.trade_expectancy, 2)],
    ];
    rows.forEach(function(r){ html += '<div class="metric"><span>' + r[0] + '</span><span class="v">' + (r[1] == null ? '—' : r[1]) + '</span></div>'; });
    return html;
  }

  function renderCurveChart(d){
    var ctx = document.getElementById('curveChart');
    if (!ctx) return;
    if (chartObj) { try { chartObj.destroy(); } catch(_){} chartObj = null; }
    var labels = d.curve.map(p => p.date);
    var pf = d.curve.map(p => p.portfolio_value);
    var bench = []; // we don't have a benchmark curve series in same scale; we draw cash + invested ratio against initial capital
    // benchmark drawn from summary.benchmark_metrics is just a single number — instead show cash split as a stacked-area-like dataset
    chartObj = new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [
          { label: d.summary.portfolio_name, data: pf, borderColor: '#388bfd', backgroundColor: 'rgba(56,139,253,.15)', borderWidth: 2, fill: true, tension: 0.15, pointRadius: 0 },
          { label: 'Initial capital', data: labels.map(()=>d.summary.initial_capital), borderColor: '#8b949e', borderDash: [4,4], borderWidth: 1, pointRadius: 0 },
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false, interaction: { intersect: false, mode: 'index' },
        plugins: { legend: { position: 'top', labels: { color: '#8b949e' } } },
        scales: { x: { ticks: { color: '#8b949e', maxTicksLimit: 8 }, grid: { color: 'rgba(255,255,255,.05)' } }, y: { ticks: { color: '#8b949e' }, grid: { color: 'rgba(255,255,255,.05)' } } }
      }
    });
  }

  function escapeHtml(s){ return String(s).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }

  function renderCompare(){
    return Promise.all(selected.map(pid => loadPortfolio(pid))).then(function(arr){
      var host = document.getElementById('compareView');
      var html = '<div class="card"><div class="card-header"><h2>Equity curves</h2><span class="badge">' + arr.length + ' selected</span></div><div class="chart-wrap"><canvas id="cmpChart"></canvas></div></div>';
      html += '<div class="compare-grid" style="margin-top:16px;">';
      arr.forEach(function(d){
        var s = d.summary, m = s.metrics || {}, bm = s.benchmark_metrics || {};
        html += '<div class="compare-card"><h3>' + s.portfolio_name + ' <span class="pill">' + s.portfolio_id + '</span></h3>';
        html += '<div class="small" style="margin-bottom:8px">' + (s.description || '') + '</div>';
        html += '<div class="metric"><span>Signal source</span><span class="v">' + (s.metadata.signal_source || '—') + '</span></div>';
        html += '<div class="metric"><span>Total return</span><span class="v ' + cls(m.total_return) + '">' + fmt(m.total_return, 2, 'pct') + '</span></div>';
        html += '<div class="metric"><span>Benchmark return</span><span class="v">' + fmt(bm.total_return, 2, 'pct') + '</span></div>';
        html += '<div class="metric"><span>CAGR</span><span class="v ' + cls(m.cagr) + '">' + fmt(m.cagr, 2, 'pct') + '</span></div>';
        html += '<div class="metric"><span>Sharpe</span><span class="v">' + fmt(m.sharpe_ratio, 2) + '</span></div>';
        html += '<div class="metric"><span>Max DD</span><span class="v neg">' + fmt(m.max_drawdown, 2, 'pct') + '</span></div>';
        html += '<div class="metric"><span>Volatility</span><span class="v">' + fmt(m.volatility_annualised, 2, 'pct') + '</span></div>';
        html += '<div class="metric"><span>Trades</span><span class="v">' + (m.trade_n_trades || 0) + '</span></div>';
        html += '<div class="metric"><span>Win rate</span><span class="v">' + fmt(m.trade_win_rate, 1, 'pct') + '</span></div>';
        html += '<div class="metric"><span>Profit factor</span><span class="v">' + fmt(m.trade_profit_factor, 2) + '</span></div>';
        html += '<div class="metric"><span>Final value</span><span class="v">' + fmt(s.final_value, 0, 'money') + '</span></div>';
        html += '</div>';
      });
      html += '</div>';
      host.innerHTML = html;

      // draw chart
      if (chartObj) { try { chartObj.destroy(); } catch(_){} chartObj = null; }
      var colors = ['#388bfd', '#3fb950', '#e3b341', '#f85149', '#a371f7', '#f78166'];
      var allDates = arr[0].curve.map(p => p.date);
      var datasets = arr.map(function(d, i){
        return {
          label: d.summary.portfolio_name,
          data: d.curve.map(p => p.portfolio_value / d.summary.initial_capital * 100),
          borderColor: colors[i % colors.length],
          backgroundColor: 'transparent',
          borderWidth: 2, pointRadius: 0, tension: 0.15
        };
      });
      chartObj = new Chart(document.getElementById('cmpChart'), {
        type: 'line',
        data: { labels: allDates, datasets: datasets },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { position: 'top', labels: { color: '#8b949e' } } },
          scales: {
            x: { ticks: { color: '#8b949e', maxTicksLimit: 8 } },
            y: { ticks: { color: '#8b949e', callback: function(v){ return v + '%'; } } }
          }
        }
      });
    });
  }

  function render(){
    var mode = document.getElementById('viewMode').value;
    if (mode === 'single') {
      document.getElementById('singleView').style.display = '';
      document.getElementById('compareView').style.display = 'none';
      renderSingle(selected[0]);
    } else {
      document.getElementById('singleView').style.display = 'none';
      document.getElementById('compareView').style.display = '';
      renderCompare();
    }
  }
  document.getElementById('viewMode').addEventListener('change', function(){
    var mode = document.getElementById('viewMode').value;
    if (mode === 'single' && selected.length > 1) selected = [selected[0]];
    renderPortfolioBar();
    render();
  });

  function load(){
    Promise.all([
      fetch('../data/portfolios/index.json').then(r=>r.json()),
      fetch('../data/meta.json').then(r=>r.json()).catch(()=>({}))
    ]).then(function(res){
      portfolios = res[0] || [];
      if (!portfolios.length) {
        document.querySelector('.container').innerHTML += '<div class="empty">No portfolios available. Run <code>python dashboard/generate.py</code> to generate them.</div>';
        return;
      }
      selected = [portfolios[0].portfolio_id];
      var meta = res[1] || {};
      document.getElementById('meta').textContent = 'Data version: ' + (meta.data_version || '—') + ' | commit: ' + (meta.git_commit || '').slice(0, 8) + ' | generated: ' + (meta.generated_at_utc || '');
      renderPortfolioBar();
      render();
    });
  }
  load();
})();
</script>
</body>
</html>
