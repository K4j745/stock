<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.plot.ly https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<title>StocKK Forecast — Price Charts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root, [data-theme="dark"] {
    --color-bg: #0d1117;
    --color-surface: #161b22;
    --color-surface-2: #1c2128;
    --color-surface-offset: #21262d;
    --color-border: #30363d;
    --color-divider: #21262d;
    --color-text: #e6edf3;
    --color-text-muted: #8b949e;
    --color-text-faint: #484f58;
    --color-primary: #388bfd;
    --color-primary-hover: #58a6ff;
    --color-primary-highlight: #1f3358;
    --color-success: #3fb950;
    --color-success-muted: #1a3a24;
    --color-error: #f85149;
    --color-error-muted: #3d1a1a;
    --color-warning: #e3b341;
    --color-warning-muted: #3a2f12;
    --font-display: 'Inter', system-ui, sans-serif;
    --font-body: 'Inter', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
    --radius-sm: 0.375rem;
    --radius-md: 0.5rem;
    --radius-lg: 0.75rem;
    --radius-xl: 1rem;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
    --transition-interactive: 150ms cubic-bezier(0.16, 1, 0.3, 1);
    --plotly-bg: #0d1117;
    --plotly-surface: #161b22;
    --plotly-grid: #21262d;
    --plotly-line: #30363d;
    --plotly-text: #8b949e;
  }

  [data-theme="light"] {
    --color-bg: #f6f8fa;
    --color-surface: #ffffff;
    --color-surface-2: #f6f8fa;
    --color-surface-offset: #f0f3f6;
    --color-border: #d0d7de;
    --color-divider: #eaeef2;
    --color-text: #1f2328;
    --color-text-muted: #656d76;
    --color-text-faint: #adb5bd;
    --color-primary: #0969da;
    --color-primary-hover: #0550ae;
    --color-primary-highlight: #dbeafe;
    --color-success: #1a7f37;
    --color-success-muted: #d4f8df;
    --color-error: #cf222e;
    --color-error-muted: #fde8e8;
    --color-warning: #9a6700;
    --color-warning-muted: #fff8c5;
    --plotly-bg: #f6f8fa;
    --plotly-surface: #ffffff;
    --plotly-grid: #eaeef2;
    --plotly-line: #d0d7de;
    --plotly-text: #656d76;
  }

  body {
    background: var(--color-bg);
    color: var(--color-text);
    font-family: var(--font-body);
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* Header */
  .site-header {
    position: sticky;
    top: 0;
    z-index: 100;
    height: 56px;
    background: var(--color-surface);
    border-bottom: 1px solid var(--color-border);
    display: flex;
    align-items: center;
    padding: 0 24px;
    backdrop-filter: blur(12px);
  }
  .site-header .logo {
    display: flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    color: var(--color-text);
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 16px;
    flex-shrink: 0;
  }
  .site-header .logo svg { color: var(--color-primary); }
  .site-header nav { display: flex; gap: 4px; margin: 0 auto; }
  .site-header nav a {
    color: var(--color-text-muted);
    text-decoration: none;
    padding: 6px 16px;
    border-radius: var(--radius-md);
    font-size: 14px;
    font-weight: 500;
    transition: color var(--transition-interactive), background var(--transition-interactive);
  }
  .site-header nav a:hover { color: var(--color-text); background: var(--color-surface-offset); }
  .site-header nav a.active { color: var(--color-text); background: var(--color-surface-2); }
  .header-right { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .theme-toggle {
    background: none;
    border: 1px solid var(--color-border);
    color: var(--color-text-muted);
    width: 36px;
    height: 36px;
    border-radius: var(--radius-md);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color var(--transition-interactive), border-color var(--transition-interactive);
  }
  .theme-toggle:hover { color: var(--color-text); border-color: var(--color-text-muted); }
  .hamburger {
    display: none;
    background: none;
    border: none;
    color: var(--color-text-muted);
    cursor: pointer;
    padding: 4px;
  }
  .mobile-nav {
    display: none;
    position: fixed;
    top: 56px;
    left: 0;
    right: 0;
    background: var(--color-surface);
    border-bottom: 1px solid var(--color-border);
    padding: 8px 16px;
    z-index: 99;
    flex-direction: column;
    gap: 4px;
  }
  .mobile-nav.open { display: flex; }
  .mobile-nav a {
    color: var(--color-text-muted);
    text-decoration: none;
    padding: 10px 16px;
    border-radius: var(--radius-md);
    font-size: 14px;
    font-weight: 500;
  }
  .mobile-nav a.active { color: var(--color-text); background: var(--color-surface-2); }
  @media (max-width: 768px) {
    .site-header nav { display: none; }
    .hamburger { display: block; }
  }

  /* Container */
  .container { max-width: 1880px; margin: 0 auto; padding: 24px; }

  /* Ticker and range controls */
  .price-controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 12px 24px;
    margin-bottom: 16px;
  }
  .ticker-pills {
    display: flex;
    gap: 6px;
    min-width: 0;
    max-width: 100%;
    overflow-x: auto;
    padding-bottom: 2px;
    scrollbar-width: thin;
  }
  .ticker-pill, .range-btn {
    min-height: var(--control-h);
    padding: 0 14px;
    background: var(--panel-bg);
    color: var(--color-text-muted);
    border: 1px solid var(--color-border);
    border-radius: 0;
    cursor: pointer;
    white-space: nowrap;
    transition: color var(--transition-interactive), background var(--transition-interactive), border-color var(--transition-interactive);
  }
  .ticker-pill {
    flex-shrink: 0;
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 500;
    clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
  }
  .ticker-pill:hover, .range-btn:hover {
    color: var(--color-text);
    border-color: var(--color-text-muted);
  }
  .ticker-pill.active, .range-btn.active {
    color: var(--color-primary);
    background: linear-gradient(180deg, rgba(0,255,136,0.18), rgba(0,255,136,0.05));
    border-color: var(--color-primary);
  }
  .ticker-pill:focus-visible, .range-btn:focus-visible {
    outline: 2px solid var(--color-primary);
    outline-offset: -3px;
  }

  /* Time range buttons */
  .range-group {
    display: flex;
    flex-shrink: 0;
    clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
  }
  .range-btn {
    font-family: var(--font-display);
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.04em;
  }
  .range-btn + .range-btn { margin-left: -1px; }
  .range-btn.active { position: relative; z-index: 1; }

  /* Chamfered neon frame. The polygon traces an outer and an inner outline, so
     the line also runs along the cut corners. */
  .frame {
    --frame-cut: var(--cyber-chamfer);
    --frame-diagonal: calc(var(--frame-cut) + 0.41px);
    position: relative;
    clip-path: polygon(
      var(--frame-cut) 0, 100% 0,
      100% calc(100% - var(--frame-cut)),
      calc(100% - var(--frame-cut)) 100%,
      0 100%, 0 var(--frame-cut)
    );
  }
  .frame::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background: linear-gradient(135deg, var(--color-primary), var(--color-border) 30%, var(--color-border) 70%, var(--color-warning));
    opacity: 0.75;
    transition: opacity var(--transition-interactive);
    clip-path: polygon(evenodd,
      var(--frame-cut) 0, 100% 0,
      100% calc(100% - var(--frame-cut)),
      calc(100% - var(--frame-cut)) 100%,
      0 100%, 0 var(--frame-cut), var(--frame-cut) 0,
      var(--frame-diagonal) 1px, calc(100% - 1px) 1px,
      calc(100% - 1px) calc(100% - var(--frame-diagonal)),
      calc(100% - var(--frame-diagonal)) calc(100% - 1px),
      1px calc(100% - 1px), 1px var(--frame-diagonal),
      var(--frame-diagonal) 1px
    );
  }
  .frame:hover::before { opacity: 1; }

  /* Stats strip above the charts */
  .chart-layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 14px;
  }
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    gap: 12px;
  }
  .stat-tile {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 8px;
    min-height: 84px;
    padding: 14px 12px;
    background: var(--panel-bg);
    text-align: center;
  }
  .stat-label {
    font-family: var(--font-display);
    font-size: 10.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--color-text-muted);
  }
  .stat-value {
    font-family: var(--font-mono);
    font-size: 18px;
    font-variant-numeric: tabular-nums;
    color: var(--color-text);
    text-shadow: 0 0 7px rgba(0,255,136,0.22);
  }
  .stat-value.is-range { font-size: 15px; }
  .stat-value.is-buy { color: var(--color-success); }
  .stat-value.is-sell { color: var(--color-error); }
  .stat-value.is-hold { color: var(--color-warning); }
  .stats-empty {
    grid-column: 1 / -1;
    padding: 18px;
    text-align: center;
    font-size: 13px;
    color: var(--color-text-muted);
  }

  /* Chart panels */
  .chart-stack { display: grid; gap: 14px; min-width: 0; }
  /* Near-solid: real price data must not blend with the decorative candles. */
  .chart-panel {
    min-width: 0;
    padding: 8px 10px;
    background: color-mix(in srgb, var(--color-surface) 90%, transparent);
  }
  .chart-box { min-height: 600px; overflow: hidden; }
  .chart-box.is-small { min-height: 240px; }

  @media (min-width: 1024px) {
    .stat-tile { backdrop-filter: blur(3px); }
  }
  @media (max-width: 1100px) {
    .stats-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }
  @media (max-width: 767.98px) {
    .chart-box { min-height: 420px; }
    .range-group { width: 100%; }
    .range-btn { flex: 1; padding: 0 6px; }
  }
  @media (max-width: 560px) {
    .stats-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .stat-tile { padding: 12px 8px; }
    .stat-value { font-size: 16px; }
    .stat-value.is-range { font-size: 13px; }
    .chart-panel { padding: 6px 4px; }
  }
  @media (max-width: 360px) {
    .stat-value.is-range { font-size: 11.5px; }
  }

  /* Loading */
  .loading-state {
    text-align: center;
    padding: 80px 20px;
    color: var(--color-text-muted);
  }
  .spinner {
    display: inline-block;
    width: 24px;
    height: 24px;
    border: 2px solid var(--color-border);
    border-top-color: var(--color-primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .error-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--color-error);
    background: var(--color-error-muted);
    border-radius: var(--radius-lg);
    margin: 20px 0;
  }

  .site-footer {
    text-align: center;
    padding: 24px 0;
    color: var(--color-text-faint);
    font-size: 12px;
    margin-top: 48px;
    border-top: 1px solid var(--color-divider);
  }
</style>

<script>
(function() {
  // Theme
  var saved = localStorage.getItem('stockwatch-theme');
  var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  var theme = saved || (prefersDark ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', theme);
  updateThemeIcon(theme);

  document.getElementById('themeToggle').addEventListener('click', function() {
    var current = document.documentElement.getAttribute('data-theme');
    var next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('stockwatch-theme', next);
    updateThemeIcon(next);
    if (currentData) renderCharts(currentData);
  });

  function updateThemeIcon(t) {
    document.querySelector('.icon-sun').style.display = t === 'dark' ? 'block' : 'none';
    document.querySelector('.icon-moon').style.display = t === 'light' ? 'block' : 'none';
  }

  document.getElementById('hamburgerBtn').addEventListener('click', function() {
    document.getElementById('mobileNav').classList.toggle('open');
  });

  var tickerPills = document.getElementById('tickerPills');
  var rangeBtns = document.querySelectorAll('.range-btn');
  var currentRange = 365;
  var currentData = null;
  var currentTicker = '';
  var signalsMap = {};

  function getPlotlyTheme() {
    var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    return {
      // Transparent: the .chart-panel behind the plot supplies the background.
      paper_bgcolor: 'rgba(0,0,0,0)',
      plot_bgcolor: 'rgba(0,0,0,0)',
      font: { family: 'JetBrains Mono, Share Tech Mono, monospace', color: isDark ? '#9a9ab5' : '#4a4f5e', size: 11 },
      xaxis: { gridcolor: isDark ? '#22222e' : '#e3e7ee', linecolor: isDark ? '#2a2a3a' : '#c2c8d4', rangeslider: { visible: false } },
      yaxis: { gridcolor: isDark ? '#22222e' : '#e3e7ee', linecolor: isDark ? '#2a2a3a' : '#c2c8d4' },
      margin: { l: 50, r: 16, t: 36, b: 40 }
    };
  }

  var plotlyConfig = { responsive: true, displayModeBar: false };
  var PHONE_MAX_WIDTH = 767;
  var NARROW_PHONE_MAX_WIDTH = 360;
  var CANDLE_HEIGHT_PHONE = 420;
  var CANDLE_HEIGHT_DESKTOP = 600;
  var INDICATOR_HEIGHT = 240;

  function tr(key, fallback) {
    return window.S4C ? window.S4C.t(key) : fallback;
  }

  // app.js is deferred, so labels drawn before it loads are refreshed here too.
  function refreshLabels() {
    if (!currentData) return;
    updateInfoPanel(currentData, currentTicker);
    renderCharts(currentData);
  }
  document.addEventListener('s4c:langchange', refreshLabels);
  document.addEventListener('DOMContentLoaded', refreshLabels);

  // Load tickers + signals + sector palette
  function hexAlpha(hex, a) {
    var h = String(hex || '#a371f7').replace('#', '');
    if (h.length === 3) h = h.split('').map(function(c){ return c+c; }).join('');
    var r=parseInt(h.slice(0,2),16), g=parseInt(h.slice(2,4),16), b=parseInt(h.slice(4,6),16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
  }
  Promise.all([
    fetch('../data/tickers.json').then(function(r) { return r.json(); }),
    fetch('../data/signals.json').then(function(r) { return r.json(); }).catch(function() { return []; }),
    fetch('../data/registry/tickers.json').then(function(r) { return r.json(); }).catch(function() { return null; }),
    fetch('../data/meta.json').then(function(r) { return r.json(); }).catch(function() { return null; })
  ]).then(function(results) {
    var tickers = results[0];
    results[1].forEach(function(s) { signalsMap[s.ticker] = s; });
    var registry = results[2] || [];
    var meta = results[3] || {};
    var palette = (meta && meta.sector_palette) || {};

    function sectorOf(t) {
      var info = registry.find(function(r){ return r.symbol === t; });
      return info && info.sector || 'Other';
    }
    function colorOf(t) {
      return palette[sectorOf(t)] || palette['Other'] || '#388bfd';
    }

    tickerPills.innerHTML = '';
    if (!Array.isArray(tickers) || tickers.length === 0) {
      tickerPills.innerHTML = '<div style="color:var(--color-text-muted);font-size:13px;padding:8px;">No tickers available. Run <code>python dashboard/generate.py</code> to generate data.</div>';
      document.getElementById('candlestickChart').innerHTML = '<div class="empty-state" style="padding:60px 20px;text-align:center;color:var(--color-text-muted);">No data yet.</div>';
      return;
    }
    tickers.forEach(function(t, i) {
      var btn = document.createElement('button');
      var col = colorOf(t);
      btn.className = 'ticker-pill' + (i === 0 ? ' active' : '');
      btn.title = sectorOf(t);
      // Sector accent — coloured left border + subtle tinted background on the pill.
      btn.style.cssText = 'border-left:3px solid ' + col + ';';
      btn.innerHTML = '<span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:' + col + ';margin-right:6px;vertical-align:middle;"></span>' + t;
      btn.addEventListener('click', function() {
        tickerPills.querySelectorAll('.ticker-pill').forEach(function(b) { b.classList.remove('active'); });
        btn.classList.add('active');
        loadTicker(t);
      });
      tickerPills.appendChild(btn);
    });
    loadTicker(tickers[0]);
  }).catch(function(err) {
    tickerPills.innerHTML = '<div style="color:var(--color-error);font-size:13px;padding:8px;">Failed to load tickers: ' + (err && err.message || err) + '</div>';
    document.getElementById('candlestickChart').innerHTML = '<div class="error-state">tickers.json could not be loaded. Run <code>python dashboard/generate.py</code>.</div>';
  });

  rangeBtns.forEach(function(btn) {
    btn.addEventListener('click', function() {
      rangeBtns.forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      currentRange = parseInt(btn.getAttribute('data-range'));
      if (currentData) renderCharts(currentData);
    });
  });

  function filterByRange(data) {
    if (currentRange === 0) return data;
    var cutoff = new Date();
    cutoff.setDate(cutoff.getDate() - currentRange);
    var cutoffStr = cutoff.toISOString().slice(0, 10);
    return data.filter(function(d) { return d.date >= cutoffStr; });
  }

  // Defensive: clear every chart container we own. Plotly.newPlot replaces
  // the container's innerHTML when it draws, but we also reset to a clean
  // spinner here so a stale render or a re-entrant loadTicker call never
  // leaves a stray "Loading X..." block visible next to a drawn chart.
  function resetChartContainers(ticker) {
    var spinner = '<div class="loading-state"><div class="spinner"></div><div>Loading ' + ticker + '…</div></div>';
    ['candlestickChart', 'rsiChart', 'macdChart'].forEach(function(id, i){
      var el = document.getElementById(id);
      if (!el) return;
      // Show the spinner only on the first chart so we don't get three of them.
      el.innerHTML = (i === 0) ? spinner : '';
      // Drop any Plotly internal state, just in case.
      if (window.Plotly && Plotly.purge) { try { Plotly.purge(id); } catch(_){} }
    });
  }

  function showChartError(msg) {
    ['rsiChart', 'macdChart'].forEach(function(id){
      var el = document.getElementById(id); if (el) el.innerHTML = '';
    });
    var c = document.getElementById('candlestickChart');
    if (c) c.innerHTML = '<div class="error-state">' + msg + '</div>';
  }

  // Generation epoch lets us cache-bust the per-ticker OHLCV JSON files so
  // a hard refresh of the deploy is no longer required after a workflow
  // updates the data. Falls back to Date.now() if last_updated.json wasn't
  // loaded yet.
  var cacheTag = String(Date.now());
  fetch('../data/last_updated.json')
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){ if (j && j.timestamp) cacheTag = encodeURIComponent(j.timestamp); })
    .catch(function(){});

  function loadTicker(ticker) {
    currentTicker = ticker;
    resetChartContainers(ticker);

    // Safety net: if the fetch hangs (network stall / blocked URL),
    // surface a visible error rather than leaving the spinner up forever.
    var stillLoading = true;
    var timeoutId = setTimeout(function(){
      if (stillLoading) {
        showChartError('Timed out loading ' + ticker + ' OHLCV after 15s. Try a hard refresh (Ctrl+Shift+R).');
      }
    }, 15000);

    fetch('../data/' + ticker + '_ohlcv.json?v=' + cacheTag, { cache: 'no-store' })
      .then(function(r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function(data) {
        stillLoading = false; clearTimeout(timeoutId);
        if (!Array.isArray(data) || data.length === 0) {
          showChartError('No OHLCV records for ' + ticker + '.');
          currentData = null;
          return;
        }
        currentData = data;
        try {
          renderCharts(data);
          updateInfoPanel(data, ticker);
        } catch (e) {
          showChartError('Chart render error for ' + ticker + ': ' + (e && e.message || e));
        }
      })
      .catch(function(err) {
        stillLoading = false; clearTimeout(timeoutId);
        showChartError('Failed to load ' + ticker + ': ' + (err && err.message || err));
      });
  }

  // Null-safe number formatter — every OHLCV / indicator field can be null
  // when we're inside a warm-up window or a market holiday.
  function fmt(v, digits, prefix) {
    if (v === null || v === undefined || (typeof v === 'number' && isNaN(v))) return 'N/A';
    return (prefix || '') + Number(v).toFixed(digits);
  }

  function updateInfoPanel(data, ticker) {
    var panel = document.getElementById('infoPanel');
    var last = data[data.length - 1];
    if (!last) {
      panel.innerHTML = '<div class="stats-empty">' + tr('prices.stats.none', 'No data available for') + ' ' + ticker + '.</div>';
      return;
    }

    var sig = signalsMap[ticker];
    var dayRange = (last.low != null && last.high != null)
      ? (fmt(last.low, 2, '$') + ' - ' + fmt(last.high, 2, '$'))
      : 'N/A';

    // Compute 52-week range — skip null entries defensively.
    var cutoff52 = new Date();
    cutoff52.setDate(cutoff52.getDate() - 365);
    var cutoffStr = cutoff52.toISOString().slice(0, 10);
    var yearData = data.filter(function(d) { return d.date >= cutoffStr; });
    var yearLow = Infinity, yearHigh = -Infinity;
    yearData.forEach(function(d) {
      if (d.low != null && d.low < yearLow) yearLow = d.low;
      if (d.high != null && d.high > yearHigh) yearHigh = d.high;
    });
    var range52 = (yearLow !== Infinity)
      ? (fmt(yearLow, 2, '$') + ' - ' + fmt(yearHigh, 2, '$'))
      : 'N/A';

    var signal = sig ? sig.signal : 'N/A';
    var signalClass = { BUY: ' is-buy', SELL: ' is-sell', HOLD: ' is-hold' }[signal] || '';
    var tiles = [
      [tr('prices.stat.price', 'Price') + ' \u00b7 ' + ticker, fmt(last.close, 2, '$'), ''],
      [tr('prices.stat.dayRange', 'Day range'), dayRange, ' is-range'],
      [tr('prices.stat.yearRange', '52W range'), range52, ' is-range'],
      ['RSI', fmt(last.rsi, 1), ''],
      ['MACD', fmt(last.macd, 4), ''],
      [tr('prices.stat.signal', 'Signal'), signal, signalClass]
    ];
    panel.innerHTML = tiles.map(function(tile) {
      return '<div class="stat-tile frame"><span class="stat-label">' + tile[0] + '</span>' +
        '<span class="stat-value' + tile[2] + '">' + tile[1] + '</span></div>';
    }).join('');
  }

  function renderCharts(rawData) {
    var data = filterByRange(rawData);
    if (!data || data.length === 0) {
      document.getElementById('candlestickChart').innerHTML = '<div class="empty-state" style="padding:60px 20px;text-align:center;color:var(--color-text-muted);">No data in selected range. Try a wider range.</div>';
      document.getElementById('rsiChart').innerHTML = '';
      document.getElementById('macdChart').innerHTML = '';
      return;
    }
    // Plotly.newPlot draws its graph into the container but does NOT remove a
    // pre-existing spinner node we injected in resetChartContainers(). That
    // stray "Loading X…" block ends up wedged inside #candlestickChart, right
    // above the RSI panel, and reads to the user as "the second chart won't
    // load". Strip any leftover loading/empty placeholders before drawing.
    ['candlestickChart', 'rsiChart', 'macdChart'].forEach(function(id) {
      var el = document.getElementById(id);
      if (!el) return;
      el.querySelectorAll('.loading-state, .empty-state').forEach(function(n) { n.remove(); });
    });

    var dates = data.map(function(d) { return d.date; });
    var opens = data.map(function(d) { return d.open; });
    var highs = data.map(function(d) { return d.high; });
    var lows = data.map(function(d) { return d.low; });
    var closes = data.map(function(d) { return d.close; });

    var theme = getPlotlyTheme();

    // Candlestick — cyberpunk: neon green up / neon red down.
    var candleTrace = {
      x: dates, open: opens, high: highs, low: lows, close: closes,
      type: 'candlestick',
      name: currentTicker,
      increasing: { line: { color: '#00ff88' }, fillcolor: '#00ff88' },
      decreasing: { line: { color: '#ff3366' }, fillcolor: '#ff3366' }
    };

    var sma20 = data.map(function(d) { return d.sma20; });
    var sma50 = data.map(function(d) { return d.sma50; });
    var bbUpper = data.map(function(d) { return d.bb_upper; });
    var bbLower = data.map(function(d) { return d.bb_lower; });

    var traces = [candleTrace];
    traces.push({ x: dates, y: sma20, type: 'scatter', mode: 'lines', line: { color: '#00d4ff', width: 1 }, name: 'SMA 20' });
    traces.push({ x: dates, y: sma50, type: 'scatter', mode: 'lines', line: { color: '#ff00ff', width: 1 }, name: 'SMA 50' });
    traces.push({ x: dates, y: bbUpper, type: 'scatter', mode: 'lines', line: { color: '#64647e', width: 1, dash: 'dash' }, name: 'BB Upper' });
    traces.push({ x: dates, y: bbLower, type: 'scatter', mode: 'lines', line: { color: '#64647e', width: 1, dash: 'dash' }, name: 'BB Lower' });

    // The title sits at the very top and the legend just above the plot, so a
    // legend that wraps to two rows on a phone needs the taller top margin.
    var isPhone = window.innerWidth <= PHONE_MAX_WIDTH;
    var topMargin = isPhone ? 76 : 60;
    if (window.innerWidth <= NARROW_PHONE_MAX_WIDTH) topMargin = 96;
    var candleLayout = Object.assign({}, theme, {
      title: { text: currentTicker + ' \u2014 ' + tr('prices.chart.price', 'Price'), y: 0.985, yanchor: 'top', font: { color: theme.font.color, size: 13, family: 'Inter' } },
      showlegend: true,
      legend: { font: { size: 10, family: 'Inter' }, bgcolor: 'rgba(0,0,0,0)', orientation: 'h', x: 0.5, xanchor: 'center', y: 1.01, yanchor: 'bottom' },
      margin: Object.assign({}, theme.margin, { t: topMargin }),
      height: isPhone ? CANDLE_HEIGHT_PHONE : CANDLE_HEIGHT_DESKTOP
    });
    Plotly.newPlot('candlestickChart', traces, candleLayout, plotlyConfig);

    // RSI
    var rsiVals = data.map(function(d) { return d.rsi; });
    var rsiTraces = [
      { x: dates, y: rsiVals, type: 'scatter', mode: 'lines', line: { color: '#00d4ff', width: 1.5 }, name: 'RSI', fill: 'tozeroy', fillcolor: 'rgba(0,212,255,0.06)' },
      { x: [dates[0], dates[dates.length - 1]], y: [70, 70], type: 'scatter', mode: 'lines', line: { color: '#ff3366', width: 1, dash: 'dash' }, showlegend: false },
      { x: [dates[0], dates[dates.length - 1]], y: [30, 30], type: 'scatter', mode: 'lines', line: { color: '#00ff88', width: 1, dash: 'dash' }, showlegend: false }
    ];
    var rsiLayout = Object.assign({}, theme, {
      title: { text: 'RSI (14)', font: { color: theme.font.color, size: 12, family: 'Inter' } },
      yaxis: Object.assign({}, theme.yaxis, { range: [0, 100] }),
      height: INDICATOR_HEIGHT, showlegend: false
    });
    Plotly.newPlot('rsiChart', rsiTraces, rsiLayout, plotlyConfig);

    // MACD
    var macdVals = data.map(function(d) { return d.macd; });
    var macdSig = data.map(function(d) { return d.macd_signal; });
    var macdHist = data.map(function(d) { return d.macd_hist; });
    var histColors = macdHist.map(function(v) { return v >= 0 ? '#00ff88' : '#ff3366'; });

    var macdTraces = [
      { x: dates, y: macdHist, type: 'bar', marker: { color: histColors }, name: 'Histogram', opacity: 0.6 },
      { x: dates, y: macdVals, type: 'scatter', mode: 'lines', line: { color: '#00d4ff', width: 1.5 }, name: 'MACD' },
      { x: dates, y: macdSig, type: 'scatter', mode: 'lines', line: { color: '#ff00ff', width: 1 }, name: 'Signal' }
    ];
    var macdLayout = Object.assign({}, theme, {
      title: { text: 'MACD', font: { color: theme.font.color, size: 12, family: 'Inter' } },
      height: INDICATOR_HEIGHT, showlegend: true,
      legend: { font: { size: 10, family: 'Inter' }, bgcolor: 'rgba(0,0,0,0)', orientation: 'h', x: 1, xanchor: 'right', y: 1.1, yanchor: 'bottom' },
      barmode: 'relative'
    });
    Plotly.newPlot('macdChart', macdTraces, macdLayout, plotlyConfig);
  }
})();
</script>
</body>
</html>
